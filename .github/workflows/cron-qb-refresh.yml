name: Refresh QB Tokens

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  APP_URL: ${{ vars.APP_URL || 'https://tidelog-v2.vercel.app' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  qb-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh QuickBooks tokens
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/refresh-qb" | jq .
