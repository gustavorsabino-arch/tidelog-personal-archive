name: Data Refresh Cron

on:
  schedule:
    # Prices: every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (prices, balances, qb, all)'
        required: false
        default: 'all'

env:
  APP_URL: ${{ vars.APP_URL || 'https://tidelog-v2.vercel.app' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  prices:
    if: github.event_name == 'schedule' || github.event.inputs.job == 'prices' || github.event.inputs.job == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch prices
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/fetch-prices" | jq .

  balances:
    # Run every 15 min: at minute 0, 15, 30, 45
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'balances' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch balances
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/fetch-balances" | jq .

  qb-refresh:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'qb' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Refresh QB tokens
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/refresh-qb" | jq .
